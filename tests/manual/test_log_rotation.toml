daemonize = false

[general]
engine = "mio"
protocol = "ascii"

[metrics]
interval = "1s"

[admin]
host = "0.0.0.0"
port = "9999"
http_enabled = true
http_host = "0.0.0.0"
http_port = "9998"

[server]
host = "0.0.0.0"
port = "12321"
timeout = 100
nevent = 1024

[worker]
timeout = 100
nevent = 1024
threads = 1

[time]

[buf]

